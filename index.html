<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer - SIDRetail</title>
    <!-- Menggunakan Tailwind CSS untuk tampilan dashboard yang rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <!-- Header -->
        <header class="bg-white shadow-md rounded-lg p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🗄️ Database Explorer SIDRetail</h1>
            <p class="text-gray-600 text-sm mt-1">Eksplorasi tabel, struktur, preview data, dan relasi database MySQL via API.</p>
            
            <!-- Konfigurasi Token & Database -->
            <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">API Token</label>
                    <input type="text" id="apiToken" value="2d8cd73b32a98b101b92772f81d3b0d81" class="w-full mt-1 p-2 border rounded text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Nama Database / Schema</label>
                    <input type="text" id="dbName" placeholder="Contoh: toko_1_3" class="w-full mt-1 p-2 border rounded text-sm">
                </div>
                <div class="flex items-end">
                    <button onclick="loadTables()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded text-sm transition">
                        📋 Muat Semua Tabel
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            
            <!-- Sidebar: Daftar Tabel -->
            <div class="bg-white shadow-md rounded-lg p-4 md:col-span-1">
                <h2 class="font-bold text-gray-700 mb-3 border-b pb-2 text-sm">Daftar Tabel</h2>
                <div id="tableList" class="space-y-1 overflow-y-auto max-h-[500px] text-sm">
                    <p class="text-gray-400 text-xs italic">Klik "Muat Semua Tabel" terlebih dahulu.</p>
                </div>
            </div>

            <!-- Panel Utama: Detail (Struktur & Preview) -->
            <div class="bg-white shadow-md rounded-lg p-6 md:col-span-3">
                <div id="panelHeader" class="mb-4 flex justify-between items-center border-b pb-3">
                    <h2 id="activeTableTitle" class="text-lg font-bold text-gray-800">Pilih tabel di sebelah kiri</h2>
                    <div id="actionButtons" class="space-x-2 hidden">
                        <button onclick="viewStructure()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs">🔍 Struktur Tabel</button>
                        <button onclick="viewData()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-xs">📊 Preview Data (Limit 20)</button>
                    </div>
                </div>

                <!-- Area Output Hasil Eksekusi Query -->
                <div id="resultArea" class="overflow-x-auto">
                    <p class="text-gray-500 text-sm italic text-center py-10">Belum ada data yang dipilih.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logika Explorer -->
    <script>
        let selectedTable = "";

        // Fungsi Helper untuk generate Unique Kode TRX
        function generateTrx() {
            return "TR_" + Date.now();
        }

        // 1. SHOW TABLES
        async function loadTables() {
            const token = document.getElementById('apiToken').value;
            const db = document.getElementById('dbName').value;
            const tableListDiv = document.getElementById('tableList');

            if (!db) {
                alert("Masukkan nama database terlebih dahulu (misal: toko_1_3 atau informasi database Anda).");
                return;
            }

            tableListDiv.innerHTML = '<p class="text-blue-500 text-xs animate-pulse">Memuat tabel...</p>';
            
            const query = `SHOW TABLES FROM ${db}`;
            const url = `https://sidretail.id/api/${token}/${generateTrx()}/${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.status === "success") {
                    tableListDiv.innerHTML = "";
                    // MySQL biasanya mengembalikan nama kunci kolom dinamis seperti Tables_in_namadb
                    json.data.forEach(row => {
                        const tableName = Object.values(row)[0];
                        const btn = document.createElement('button');
                        btn.className = "w-full text-left px-2 py-1.5 hover:bg-blue-50 rounded text-gray-700 truncate text-xs font-medium";
                        btn.innerText = tableName;
                        btn.onclick = () => selectTableRow(tableName);
                        tableListDiv.appendChild(btn);
                    });
                } else {
                    tableListDiv.innerHTML = `<p class="text-red-500 text-xs">Error: ${json.result}</p>`;
                }
            } catch (err) {
                tableListDiv.innerHTML = `<p class="text-red-500 text-xs">Gagal koneksi API.</p>`;
            }
        }

        function selectTableRow(tableName) {
            selectedTable = tableName;
            document.getElementById('activeTableTitle').innerText = "Tabel: " + tableName;
            document.getElementById('actionButtons').classList.remove('hidden');
            viewStructure(); // Otomatis tampilkan struktur saat tabel diklik
        }

        // 2. DESCRIBE TABLE (Struktur Tabel)
        async function viewStructure() {
            const token = document.getElementById('apiToken').value;
            const db = document.getElementById('dbName').value;
            const resultArea = document.getElementById('resultArea');

            resultArea.innerHTML = '<p class="text-gray-500 text-xs animate-pulse">Memuat struktur tabel...</p>';

            const query = `DESCRIBE ${db}.${selectedTable}`;
            const url = `https://sidretail.id/api/${token}/${generateTrx()}/${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.status === "success") {
                    let html = `<h3 class="font-semibold text-sm mb-2 text-gray-700">Struktur Kolom</h3>
                                <table class="w-full text-left border-collapse text-xs">
                                <thead><tr class="bg-gray-100 border-b">
                                    <th class="p-2 border">Field</th>
                                    <th class="p-2 border">Type</th>
                                    <th class="p-2 border">Null</th>
                                    <th class="p-2 border">Key</th>
                                    <th class="p-2 border">Default</th>
                                    <th class="p-2 border">Extra</th>
                                </tr></thead><tbody>`;

                    json.data.forEach(col => {
                        html += `<tr class="border-b hover:bg-gray-50">
                            <td class="p-2 border font-medium">${col.Field || ''}</td>
                            <td class="p-2 border text-blue-600">${col.Type || ''}</td>
                            <td class="p-2 border">${col.Null || ''}</td>
                            <td class="p-2 border font-bold text-red-600">${col.Key || ''}</td>
                            <td class="p-2 border">${col.Default !== null ? col.Default : 'NULL'}</td>
                            <td class="p-2 border">${col.Extra || ''}</td>
                        </tr>`;
                    });
                    html += `</tbody></table>`;
                    resultArea.innerHTML = html;
                } else {
                    resultArea.innerHTML = `<p class="text-red-500 text-xs">Gagal: ${json.result}</p>`;
                }
            } catch (err) {
                resultArea.innerHTML = `<p class="text-red-500 text-xs">Kesalahan sistem saat mengambil struktur.</p>`;
            }
        }

        // 3. PREVIEW DATA (SELECT * LIMIT 20)
        async function viewData() {
            const token = document.getElementById('apiToken').value;
            const db = document.getElementById('dbName').value;
            const resultArea = document.getElementById('resultArea');

            resultArea.innerHTML = '<p class="text-gray-500 text-xs animate-pulse">Memuat preview data...</p>';

            const query = `SELECT * FROM ${db}.${selectedTable} LIMIT 20`;
            const url = `https://sidretail.id/api/${token}/${generateTrx()}/${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.status === "success") {
                    if (json.data.length === 0) {
                        resultArea.innerHTML = `<p class="text-gray-500 text-xs italic">Tabel ini masih kosong (0 baris data).</p>`;
                        return;
                    }

                    // Ambil kunci kolom dari objek data pertama
                    const columns = Object.keys(json.data[0]);

                    let html = `<h3 class="font-semibold text-sm mb-2 text-gray-700">Preview Data (Maksimal 20 Baris Teratas)</h3>
                                <div class="overflow-x-auto max-h-[400px]">
                                <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                                <thead><tr class="bg-gray-100 border-b sticky top-0">`;
                    
                    columns.forEach(col => {
                        html += `<th class="p-2 border bg-gray-100">${col}</th>`;
                    });
                    html += `</tr></thead><tbody>`;

                    json.data.forEach(row => {
                        html += `<tr class="border-b hover:bg-gray-50">`;
                        columns.forEach(col => {
                            html += `<td class="p-2 border text-gray-600">${row[col] !== null ? row[col] : '<span class="text-gray-300 italic">NULL</span>'}</td>`;
                        });
                        html += `</tr>`;
                    });

                    html += `</tbody></table></div>`;
                    resultArea.innerHTML = html;
                } else {
                    resultArea.json = resultArea.innerHTML = `<p class="text-red-500 text-xs">Gagal: ${json.result}</p>`;
                }
            } catch (err) {
                resultArea.innerHTML = `<p class="text-red-500 text-xs">Kesalahan sistem saat preview data.</p>`;
            }
        }
    </script>
</body>
</html>
